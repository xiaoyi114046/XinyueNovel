plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoyi.xinyuenovel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiaoyi.xinyuenovel'
        minSdk 23
        targetSdk 28
        versionCode 413
        versionName '4.1.3-android.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
