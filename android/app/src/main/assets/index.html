<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>心阅小说</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">心阅小说</div>
      <div id="projectBadge" class="muted small"></div>
    </div>
    <button id="saveAllBtn" class="ghost">保存</button>
  </header>

  <main>
    <section id="tab-write" class="tab active">
      <div class="card">
        <div class="row gap wrap">
          <label class="grow">AI 接入
            <select id="writeProvider"></select>
          </label>
          <label>最近章节
            <select id="contextCount">
              <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="5">5</option>
            </select>
          </label>
        </div>
        <label>本章小纲<textarea id="chapterOutline" rows="4" placeholder="本章核心事件、冲突、伏笔……"></textarea></label>
        <label>特殊要求<textarea id="extraPrompt" rows="3" placeholder="例如：加强战斗细节、不要跳时间线……"></textarea></label>
        <div class="row gap wrap">
          <label>目标字数<input id="targetWords" type="number" value="2200" min="200" max="20000" /></label>
          <label>温度<input id="temperature" type="number" value="0.8" step="0.1" min="0" max="2" /></label>
          <button id="generateBtn" class="primary grow">AI 续写</button>
          <button id="stopBtn" class="danger hidden">停止</button>
        </div>
        <div id="aiStatus" class="status"></div>
      </div>

      <div class="card">
        <div class="row gap">
          <input id="chapterTitle" class="grow title-input" placeholder="章节标题" />
          <button id="newChapterBtn">新章</button>
        </div>
        <textarea id="chapterContent" class="editor" placeholder="正文内容……"></textarea>
        <div class="row gap wrap">
          <button id="saveChapterBtn" class="primary">保存本章</button>
          <button id="exportBtn">导出 TXT</button>
          <button id="shareBtn">分享全文</button>
        </div>
      </div>
    </section>

    <section id="tab-project" class="tab">
      <div class="card">
        <div class="row gap wrap">
          <label class="grow">项目<select id="projectSelect"></select></label>
          <button id="newProjectBtn">新建项目</button>
          <button id="renameProjectBtn">重命名</button>
          <button id="deleteProjectBtn" class="danger-outline">删除项目</button>
        </div>
      </div>
      <div class="card">
        <h3>章节</h3>
        <div id="chapterList" class="chapter-list"></div>
        <div class="row gap wrap top-gap">
          <button id="projectNewChapterBtn">新增章节</button>
          <button id="renameChapterBtn">重命名本章</button>
          <button id="deleteChapterBtn" class="danger">删除本章</button>
        </div>
        <div class="hint">已修复：删除确认框现可正常弹出；删除后会立即切换到相邻章节并同步本地存储。</div>
      </div>
    </section>

    <section id="tab-setting" class="tab">
      <div class="card form-grid">
        <h3>小说设定</h3>
        <label>小说类型<input data-project-field="genre" /></label>
        <label>网文流派<input data-project-field="webGenre" /></label>
        <label>文风<input data-project-field="style" /></label>
        <label>叙事视角<input data-project-field="pov" /></label>
        <label>节奏<input data-project-field="pace" /></label>
        <label>主角设定<textarea data-project-field="protagonist" rows="4"></textarea></label>
        <label>人物关系<textarea data-project-field="relations" rows="4"></textarea></label>
        <label>剧情脉络<textarea data-project-field="plot" rows="5"></textarea></label>
      </div>
    </section>

    <section id="tab-world" class="tab">
      <div class="card form-grid">
        <h3>世界观 / 大纲</h3>
        <label>世界观<textarea data-project-field="world" rows="6"></textarea></label>
        <label>境界体系<textarea data-project-field="realms" rows="6"></textarea></label>
        <label>当前境界<input data-project-field="currentRealm" /></label>
        <label>总纲<textarea data-project-field="masterOutline" rows="7"></textarea></label>
        <label>卷纲<textarea data-project-field="volumeOutline" rows="7"></textarea></label>
        <div class="row gap wrap">
          <button id="aiRealmBtn">AI 生成境界</button>
          <button id="aiOutlineBtn">AI 生成大纲</button>
        </div>
      </div>
    </section>

    <section id="tab-ai" class="tab">
      <div class="card">
        <h3>AI 接口设置</h3>
        <label>AI 平台<select id="providerSelect"></select></label>
        <div id="providerHelp" class="hint"></div>
        <label>API Key
          <div class="row gap"><input id="apiKey" class="grow" type="password" placeholder="已保存的 Key 不会回显" /><button id="saveKeyBtn">保存 Key</button></div>
        </label>
        <div id="keyState" class="status"></div>
        <label>接口地址<input id="providerEndpoint" /></label>
        <label>模型<input id="providerModel" /></label>
        <div class="row gap wrap">
          <button id="saveProviderBtn" class="primary">保存接口配置</button>
          <button id="resetProviderBtn">恢复预设</button>
          <button id="testProviderBtn">测试连接</button>
        </div>
        <div id="providerTestStatus" class="status"></div>
      </div>
      <div class="card">
        <h3>已支持</h3>
        <div id="providerCards" class="provider-cards"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-tab="write" class="active">续写</button>
    <button data-tab="project">项目</button>
    <button data-tab="setting">设定</button>
    <button data-tab="world">大纲</button>
    <button data-tab="ai">AI 接口</button>
  </nav>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
