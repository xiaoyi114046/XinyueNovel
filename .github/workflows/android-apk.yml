name: XinyueNovel Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Existing Windows Go tests
        working-directory: .
        run: go test ./...

      - name: Android JavaScript core tests
        run: node tests/core_test.js

      - name: Android static checks
        run: python3 tests/static_app_test.py

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK file
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.xiaoyi.xinyuenovel
            adb shell am start -n com.xiaoyi.xinyuenovel/.MainActivity

            ready=0
            for i in $(seq 1 60); do
              if adb logcat -d -s XinyueNovel:I '*:S' | grep -q "XINYUE_APP_READY"; then
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "App did not report JavaScript/UI readiness within 60 seconds."
              adb shell dumpsys activity activities | grep -E "xinyuenovel|mResumedActivity|topResumedActivity" || true
              adb logcat -d -t 400 || true
              exit 1
            fi

            adb shell pidof com.xiaoyi.xinyuenovel
            adb shell dumpsys activity activities | grep -q "com.xiaoyi.xinyuenovel/.MainActivity"
            echo "XinyueNovel startup smoke test: PASS"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinyueNovel-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
