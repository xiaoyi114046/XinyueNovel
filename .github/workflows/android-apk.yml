name: XinyueNovel Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS syntax and core tests
        working-directory: android
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/app.js
          node tests/core_test.js
          python3 tests/static_app_test.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Emulator install and startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x android/ci/emulator-smoke-test.sh
            android/ci/emulator-smoke-test.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinyueNovel-Android-v6.1-MultiAI
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
