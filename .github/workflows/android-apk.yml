name: XinyueNovel Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Existing Windows Go tests
        working-directory: .
        run: go test ./...

      - name: Android JavaScript core tests
        run: node tests/core_test.js

      - name: Android static checks
        run: python3 tests/static_app_test.py

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK file
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash android/ci/emulator-smoke-test.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinyueNovel-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
